<style>
:root{--pink:#ff3e9d;--cyan:#4de7ff;--gold:#ffd65a;--bg:#10091f}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090614;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;touch-action:manipulation}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{height:100dvh;min-height:100%;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 38%,#4b155c 0,#1c103a 42%,#080817 100%);position:relative;overflow:hidden}.top{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 12px 5px;position:relative;overflow:hidden}.brand{text-align:center;font-weight:1000;font-size:clamp(21px,6vw,32px);letter-spacing:.04em;color:#fff;text-shadow:0 3px #8a145c,0 0 12px #ff2d9b,2px 2px #111;margin:0 0 4px}.stage{text-align:center;font-weight:1000;font-size:clamp(14px,4vw,19px);color:#ffe45d;text-shadow:0 2px #a33b00;margin:0 0 6px}.hpbox{border:2px solid #ff9ae0;border-radius:14px;background:linear-gradient(100deg,#120d27,#351345);padding:7px 10px;box-shadow:0 0 12px #ff36ae, inset 0 0 10px #7c2d87;z-index:2}.hpline{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:clamp(13px,3.6vw,17px);margin-bottom:5px}.hpnum{color:#ffe35c;font-size:1.18em;text-shadow:0 2px #8b3000}.track{height:17px;border:2px solid #fff;border-radius:30px;background:#171326;overflow:hidden;box-shadow:0 0 7px #fff}.fill{height:100%;width:100%;background:linear-gradient(90deg,#ff244e,#ff8b31,#ffe34e);border-radius:30px;transition:width .35s ease;box-shadow:0 0 10px #ff4c32}.bossarea{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:5px -5px 0;overflow:hidden}.aura{position:absolute;width:82vw;height:82vw;max-height:100%;border-radius:50%;background:radial-gradient(circle,#ff6acb44 0,#9d35ff33 45%,transparent 70%);filter:blur(3px);animation:pulse 1.7s infinite alternate}.boss{position:relative;z-index:1;width:min(90%,420px);max-height:100%;object-fit:contain;filter:drop-shadow(0 0 13px #ff36b8);transition:transform .15s;user-select:none;-webkit-user-drag:none}.boss.hit{animation:hit .38s ease}.boss.defeated{filter:grayscale(1) brightness(.7);transform:rotate(8deg) scale(.9)}.damage{position:absolute;z-index:5;left:50%;top:42%;transform:translate(-50%,-50%) scale(.5);font-weight:1000;font-style:italic;font-size:clamp(34px,11vw,66px);color:#fff42f;-webkit-text-stroke:2px #a4002c;text-shadow:3px 4px #e40045,0 0 18px #ff8c00;opacity:0;white-space:nowrap;pointer-events:none}.damage.show{animation:damage .9s ease forwards}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}.flash.on{animation:flash .28s ease}.team{border:2px solid #6deaff;background:linear-gradient(90deg,#102c6a,#124c78,#10245c);border-radius:12px;text-align:center;padding:6px 8px;margin-top:4px;box-shadow:0 0 12px #21d9ff}.teamlabel{font-size:12px;font-weight:900;letter-spacing:.1em}.total{font-weight:1000;font-size:clamp(19px,5vw,27px);color:#9af5ff;text-shadow:0 2px #0054a6}.combo{text-align:center;color:#ffe45b;font-weight:1000;font-size:clamp(13px,3.8vw,17px);padding:5px;text-shadow:0 0 9px #ff9b00}.notice{position:absolute;z-index:6;left:50%;top:48%;transform:translate(-50%,-50%);width:90%;text-align:center;font-weight:1000;font-size:clamp(24px,7vw,42px);color:#fff;text-shadow:0 0 12px #ff38c7,3px 3px #9c145d;opacity:0;pointer-events:none}.notice.show{animation:notice 1.5s ease forwards}.controls{flex:0 0 auto;background:linear-gradient(180deg,#151027,#090815);border-top:1px solid #75417d;padding:7px 10px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -8px 25px #0008;z-index:10}.controltitle{font-size:11px;color:#c9b5e7;text-align:center;font-weight:800;margin-bottom:5px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.gift{border:1px solid #ff91d7;border-radius:10px;padding:8px 3px 7px;background:linear-gradient(150deg,#65235f,#28184b);color:#fff;font-weight:900;min-height:53px;box-shadow:0 3px 0 #100b25,0 0 8px #e63ca044;font-size:clamp(11px,3vw,14px)}.gift b{display:block;color:#ffe45d;font-size:12px;margin-top:3px}.gift:active{transform:translateY(2px);filter:brightness(1.4)}.gift.big{background:linear-gradient(150deg,#a52d42,#4c123f);border-color:#ffc26b}.bottomrow{display: @keyframes pulse{to{transform:scale(1.15);opacity:.7}}@keyframes hit{0%{transform:translateX(0) scale(1)}20%{transform:translateX(-16px) rotate(-5deg)}45%{transform:translateX(18px) rotate(5deg)}70%{transform:translateX(-8px)}100%{transform:translateX(0) scale(1)}}@keyframes damage{0%{opacity:0;transform:translate(-50%,-20%) scale(.3)}18%{opacity:1;transform:translate(-50%,-65%) scale(1.15)}75%{opacity:1;transform:translate(-50%,-100%) scale(1)}100%{opacity:0;transform:translate(-50%,-130%) scale(.9)}}@keyframes flash{0%{opacity:.9}100%{opacity:0}}@keyframes notice{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}20%,75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-65%) scale(1.1)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}

<section class="team"><div class="teamlabel">💙 視聴者チーム TOTAL DAMAGE</div><div class="total" id="total">0 DAMAGE</div></section><div class="combo" id="combo">🔥 ATTACK COMBO × 0</div>
</main><section class="controls"><div class="controltitle">🎮 ギフトが届いたら対応ボタンをタップ</div><div class="buttons">
<button class="gift" onclick="changeHP(-2,'初見です','💗')">初見です<b>HP −2</b></button><button class="gift" onclick="changeHP(2,'いつメンです','💞')">いつメンです<b>HP ＋2</b></button><button class="gift" onclick="randomGift()">進む？戻る？<b>ランダム抽選</b></button>

<script>
const stages=[{hp:1000,name:'通常形態'},{hp:2000,name:'覚醒形態'},{hp:3000,name:'怒り形態'},{hp:5000,name:'最終形態'}];
let stage=0,hp=stages[0].hp,total=0,combo=0,lastHit=0,history=[],finished=false;
const $=id=>document.getElementById(id);
function render(){const max=stages[stage].hp;$('stage').textContent=`STAGE ${stage+1}　${stages[stage].name}`;$('hptext').textContent=`${hp} / ${max}`;$('hpfill').style.width=(hp/max*100)+'%';$('total').textContent=total.toLocaleString()+' DAMAGE';$('combo').textContent=`🔥 ATTACK COMBO × ${combo}`;$('next').disabled=hp!==0||stage>=3;$('undo').disabled=!history.length;document.body.className='stage'+(stage+1);}
function saveHistory(){history.push({hp,total,combo,lastHit,finished});}
function effect(amount,emoji,label,kind){const sign=amount<0?'−':'＋';const value=Math.abs(amount);$('damage').textContent=kind==='neutral'?'±0':`${emoji} HP ${sign}${value} ${amount<0?'DAMAGE':'HEAL'}!!`;$('damage').classList.remove('show');$('flash').classList.remove('on');$('boss').classList.remove('hit');$('top').classList.remove('shake');void $('damage').offsetWidth;$('damage').classList.add('show');$('flash').classList.add('on');$('boss').classList.add('hit');$('top').classList.add('shake');$('notice').textContent=label;$('notice').classList.remove('show');void $('notice').offsetWidth;$('notice').classList.add('show');}
// delta: negative = damage, positive = boss HP recovery
function changeHP(delta,label,emoji='💥',special=false){if(hp<=0||finished)return;saveHistory();const max=stages[stage].hp;const before=hp;hp=Math.max(0,Math.min(max,hp+delta));const actual=hp-before;if(actual<0){total+=Math.abs(actual);const now=Date.now();combo=(now-lastHit<10000)?combo+1:1;lastHit=now;}else if(actual>0){combo=0;}
 effect(actual,emoji,label,actual===0?'neutral':'');render();if(hp===0)onDefeat();}
function randomGift(){if(hp<=0||finished)return;const outcomes=[{n:'+1',d:-10},{n:'+3',d:-30},{n:'+5',d:-50},{n:'+10',d:-100},{n:'−3',d:30}];const o=outcomes[Math.floor(Math.random()*outcomes.length)];changeHP(o.d,'進む？戻る？　ランダム結果 '+o.n,'🎲');}
function openJanken(){if(hp<=0||finished)return;$('jankenOverlay').classList.add('show');}
function closeJanken(){$('jankenOverlay').classList.remove('show');}
function jankenResult(result){closeJanken();if(result==='win')changeHP(-50,'最初はグー！　視聴者の勝ち','👊');else if(result==='draw')changeHP(0,'最初はグー！　あいこ','✊');else changeHP(50,'最初はグー！　視聴者の負け','💔');}
function instantDefeat(){if(hp<=0||finished)return;saveHistory();const before=hp;total+=before;hp=0;effect(-before,'🌈','いらすとやユニバ　超必殺技！');render();onDefeat();}
function onDefeat(){ $('boss').classList.add('defeated');$('notice').textContent='BOSS DOWN!!';$('notice').classList.add('show');if(stage===3){finished=true;setTimeout(()=>showModal('全ステージ討伐成功!!','視聴者チームの完全勝利！','最初から挑戦する'),650)}else{setTimeout(()=>showModal('討伐成功!!','みんなの攻撃でボス撃破！次の形態が待っている…','次の形態へ変身！'),650)}}
function showModal(title,txt,btn){$('modalTitle').textContent=title;$('modalText').textContent=txt;$('modalButton').textContent=btn;$('overlay').classList.add('show')}
function modalAction(){ $('overlay').classList.remove('show');if(finished){resetGame();return}nextStage() }
function nextStage(){if(hp!==0||stage>=3)return;stage++;hp=stages[stage].hp;combo=0;history=[];$('boss').classList.remove('defeated');render();$('notice').textContent='STAGE '+(stage+1)+'　'+stages[stage].name;$('notice').classList.remove('show');void $('notice').offsetWidth;$('notice').classList.add('show')}
function undo(){if(!history.length)return;const p=history.pop();hp=p.hp;total=p.total;combo=p.combo;lastHit=p.lastHit;finished=p.finished;$('boss').classList.remove('defeated');$('overlay').classList.remove('show');$('jankenOverlay').classList.remove('show');render()}
function resetGame(){stage=0;hp=stages[0].hp;total=0;combo=0;lastHit=0;history=[];finished=false;$('boss').classList.remove('defeated');$('overlay').classList.remove('show');$('jankenOverlay').classList.remove('show');render()}
render();
</script></body></html>
